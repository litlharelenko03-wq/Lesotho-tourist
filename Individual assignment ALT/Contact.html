    <div class="container">
      <a class="navbar-brand fw-bold" href="home.html">Journey to Lesotho</a>
      <button class="navbar-toggler navbar-dark" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">

          <li class="nav-item">
            <a class="nav-link" href="home.html">Home</a>

          <li class="nav-item">
            <a class="nav-link" href="destination.html">Destination</a>

        </ul>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="bg-white p-4 p-md-5 rounded shadow-sm">
          <h2 class="text-center mb-4">Tour Guide Registration</h2>
          
          <div id="formAlertContainer"></div>

          <!--Form -->
          <form id="registrationForm" novalidate>

            <!-- Full Name -->
            <div class="mb-3">
              <label for="fullName" class="form-label">Full Name *</label>
              <input type="text" class="form-control" id="fullName" placeholder="Enter your full name">
              <div class="error-msg"></div>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label">Email Address *</label>
              <input type="email" class="form-control" id="email" placeholder="name@gmail.com">
              <div class="error-msg"></div>
            </div>

            <!-- Phone Number -->
            <div class="mb-3">
              <label for="phone" class="form-label">Phone Number *</label>
              <input type="tel" class="form-control" id="phone" placeholder="+266 6318 1818">
              <div class="error-msg"></div>
            </div>

            <!-- Gender Select -->
            <div class="mb-3">
              <label for="gender" class="form-label">Gender</label>
              <select class="form-select" id="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="transgender">Transgender</option>
                <option value="other">Other</option>

              </select>
            </div>

            <!-- Password -->
            <div class="mb-3">
              <label for="password" class="form-label">Password *</label>
              <input type="password" class="form-control" id="password" placeholder="Minimum 6 characters">
              <div class="error-msg"></div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-4">
              <label for="confirmPassword" class="form-label">Confirm Password *</label>
              <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter password">
              <div class="error-msg"></div>
            </div>

            <button type="submit" class="btn btn-lesotho w-100">Submit</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white py-4 mt-auto">
