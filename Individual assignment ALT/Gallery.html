<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="home.html">Journey to Lesotho</a>
      <button class="navbar-toggler navbar-dark" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">

          <li class="nav-item">
            <a class="nav-link" href="home.html">Home</a></li>

            <li class="nav-item">
            <a class="nav-link" href="about.html">About</a>
          </li>

             <li class="nav-item">
            <a class="nav-link" href="destination.html">Destination</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="accomodation.html">Accomodation</a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="gallery.html">Gallery</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="contact.html">Contact</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <h1 class="text-center mb-4">A preview of your next trip </h1>
    <p class="text-center text-muted mb-4"></p>

    <div class="gallery-grid">
      <div class="gallery-item" data-bs-toggle="modal" data-bs-target="#imageModal">
        <img src="SnowyMalibaLodge.JPG" alt="Maliba Lodge in winter" class="gallery-trigger">
      </div>

      <div class="gallery-item" data-bs-toggle="modal" data-bs-target="#imageModal">
        <img src="Tshehlanyane.JPG" alt="T'sehlanyane National Park" class="gallery-trigger">
      </div>

      <div class="gallery-item" data-bs-toggle="modal" data-bs-target="#imageModal">
        <img src="Flowering-spiral-aloe.WEBP" alt="Spiral Aloe" class="gallery-trigger">
      </div>

       <div class="gallery-item" data-bs-toggle="modal" data-bs-target="#imageModal">
        <img src="TheCapital.JPG" alt="A city on the rise" class="gallery-trigger">
      </div>

    </div>
  </main>

  <!-- Bootstrap Modal (Component 5 / Lightbox) -->
  <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="lightboxCaption">Image Preview</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center p-0">
          <img id="lightboxImage" src="Malikotoana.JPG" alt="Enlarged View" class="img-fluid w-100">
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-1">&copy; 2026 Home Away From Home Tourism. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
